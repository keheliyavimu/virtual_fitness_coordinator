{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}
{% block content %}
<div class="max-w-4xl mx-auto mt-10 bg-white p-6 rounded-xl shadow">
  <h2 class="text-2xl font-semibold text-gray-800 mb-4">Welcome, {{ session['username'] }}!</h2>
  <p class="text-gray-600 mb-6">
    This is your personalized dashboard. From here you can view competitions, submit activities, and check messages.
  </p>

  <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
    <a href="{{ url_for('competitions') }}" class="bg-blue-500 hover:bg-blue-600 text-white py-3 px-4 rounded-lg shadow text-center">
      🏆 View Competitions
    </a>
    <a href="{{ url_for('leaderboard') }}" class="bg-green-500 hover:bg-green-600 text-white py-3 px-4 rounded-lg shadow text-center">
      📊 Leaderboard
    </a>
    <a href="{{ url_for('messages') }}" class="bg-purple-500 hover:bg-purple-600 text-white py-3 px-4 rounded-lg shadow text-center">
      💬 Messages
    </a>
  </div>
</div>
{% endblock %}
