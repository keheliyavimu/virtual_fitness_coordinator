{% extends "base.html" %}
{% block content %}
<div class="dashboard-container">
    <h2>Leaderboard</h2>
    <table class="leaderboard-table">
        <thead>
            <tr>
                <th>Rank</th>
                <th>Participant</th>
                <th>Score</th>
            </tr>
        </thead>
        <tbody>
            {% for entry in leaderboard %}
            <tr>
                <td>{{ loop.index }}</td>
                <td>{{ entry.username }}</td>
                <td>{{ entry.score }}</td>
            </tr>
            {% else %}
            <tr><td colspan="3">No leaderboard data yet.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
