{% extends "base.html" %}
{% block title %}{{ 'Edit Competition' if competition else 'New Competition' }}{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto mt-10 bg-white p-6 rounded-xl shadow">
  <h2 class="text-2xl font-semibold mb-4">
    {{ 'Edit Competition' if competition else 'Create New Competition' }}
  </h2>
  <form method="POST">
    <div class="mb-4">
      <label class="block mb-1 font-medium">Competition Name</label>
      <input type="text" name="competition_name" class="w-full border rounded px-3 py-2"
             value="{{ competition.name if competition else '' }}" required>
    </div>
    <div class="mb-4">
      <label class="block mb-1 font-medium">Description</label>
      <textarea name="description" class="w-full border rounded px-3 py-2" required>{{ competition.description if competition else '' }}</textarea>
    </div>
    <button type="submit" class="bg-blue-500 hover:bg-blue-600 text-white py-2 px-4 rounded">
      {{ 'Update' if competition else 'Create' }}
    </button>
  </form>
</div>
{% endblock %}
